[package]
name = "bazi-skill"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Native Rust Four Pillars (BaZi) calendar and CLI engine"
license = "MIT"
repository = "https://github.com/tzerokyi/bazi-skill"
readme = "README.md"
keywords = ["bazi", "calendar", "chinese", "lunisolar", "cli"]
categories = ["date-and-time", "command-line-utilities"]

[lib]
name = "bazi_skill"
path = "src/lib.rs"

[[bin]]
name = "bazi"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
